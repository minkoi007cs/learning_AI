# Render Blueprint — deploy backend NestJS (Docker) + Postgres + Redis.
# Import: Render Dashboard → New → Blueprint → chọn repo này.
# Frontend KHÔNG nằm ở đây (frontend deploy riêng trên Vercel).
services:
  - type: web
    name: learning-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /v1/health
    envVars:
      # App bind cổng 3001 để khớp EXPOSE + HEALTHCHECK trong Dockerfile
      - key: PORT
        value: 3001
      - key: NODE_ENV
        value: production
      - key: API_PREFIX
        value: v1
      # DB & Redis: Render tự inject connection string nội bộ
      - key: DATABASE_URL
        fromDatabase:
          name: learning-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: learning-redis
          type: redis
          property: connectionString
      # JWT secret: Render tự sinh ngẫu nhiên, an toàn
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: 7d
      # User TỰ nhập trong Dashboard sau khi import:
      - key: OPENAI_API_KEY
        sync: false
      # CORS: điền domain Vercel của frontend, vd https://learning-app.vercel.app
      - key: CORS_ORIGINS
        sync: false

databases:
  - name: learning-db
    plan: free
    databaseName: learning_db
    user: learning

# Render Key Value (Redis). ipAllowList rỗng = chỉ truy cập nội bộ.
redis:
  - name: learning-redis
    plan: free
    ipAllowList: []
